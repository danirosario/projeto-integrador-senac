<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CriArty | Produtos</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/client-styles/shop.css">
</head>

<body>
    <!-- NAVBAR -->
    <header>
        <nav class="navbar">
            <div class="nav-logo">
                <a href="#">Logo</a>
            </div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#produtos">Produtos</a></li>
                <li><a href="#sobre">Sobre</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>

        <!-- CARROSSEL -->
        <div class="slider">
            <div class="slides">
                <!-- Radio Buttons -->
                <input type="radio" name="radio-btn" id="radio1" checked>
                <input type="radio" name="radio-btn" id="radio2">
                <input type="radio" name="radio-btn" id="radio3">
                <input type="radio" name="radio-btn" id="radio4">

                <!-- Slide Imagens -->
                <div class="slide-img">
                    <img src="../images/slide_padrao.png" alt="imagem 1">
                </div>
                <div class="slide-img">
                    <img src="../images/img43.jpg" alt="imagem 2">
                </div>
                <div class="slide-img">
                    <img src="../images/slide_padrao.png" alt="imagem 3">
                </div>
                <div class="slide-img">
                    <img src="../images/slide_padrao.png" alt="imagem 4">
                </div>

                <!-- NAVIGATION AUTO -->
                <div class="navigation-auto">
                    <div class="auto-btn1"></div>
                    <div class="auto-btn2"></div>
                    <div class="auto-btn3"></div>
                    <div class="auto-btn4"></div>
                </div>
            </div>

            <!-- MANUAL NAVIGATION -->
            <div class="manual-navigation">
                <label for="radio1" class="manual-btn"></label>
                <label for="radio2" class="manual-btn"></label>
                <label for="radio3" class="manual-btn"></label>
                <label for="radio4" class="manual-btn"></label>
            </div>
        </div>

    </header>

    <!-- ÁREA DE CONTEÚDO PRINCIPAL -->
    <div class="content-area">
        <main class="main-content">

            <article class="product-card">
                <img src="caminho/para/imagem1.jpg" alt="Caneca Personalizada de Cerâmica">
                <div class="card-content">
                    <h3>Caneca Personalizada</h3>
                    <h4>Descrição</h4>
                    <span class="price">R$ 29,90</span>
                    <button type="button">Comprar</button>
                </div>
            </article>
        </main>
    </div>
    <script src="../js/slider.js"></script>
</body>

</html>
